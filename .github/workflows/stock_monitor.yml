name: 股票监控推送

on:
  schedule:
    - cron: '30 1 * * 1-5'   # 北京时间 09:30 - 早盘播报
    - cron: '0 2 * * 1-5'    # 北京时间 10:00 - 早盘播报
    - cron: '30 3 * * 1-5'   # 北京时间 11:30 - 上午收盘播报
    - cron: '30 5 * * 1-5'   # 北京时间 13:30 - 午盘播报
    - cron: '30 6 * * 1-5'   # 北京时间 14:30 - A股收盘分析
  workflow_dispatch:
    inputs:
      analysis_type:
        description: '播报类型'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - morning_close
          - noon
          - afternoon

jobs:
  stock-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3
      
      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install requests pytz akshare pandas numpy
      
      - name: 运行股票监控
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          # 获取北京时间
          BEIJING_HOUR=$(TZ='Asia/Shanghai' date +%H)
          BEIJING_MINUTE=$(TZ='Asia/Shanghai' date +%M)
          
          echo "北京时间: ${BEIJING_HOUR}:${BEIJING_MINUTE}"
          
          # 判断运行类型
          if [ "${{ github.event.inputs.analysis_type }}" != "" ] && [ "${{ github.event.inputs.analysis_type }}" != "auto" ]; then
            # 手动触发，使用指定类型
            TYPE="${{ github.event.inputs.analysis_type }}"
          elif [ "$BEIJING_HOUR" = "14" ] && [ "$BEIJING_MINUTE" = "30" ]; then
            TYPE="afternoon"
          elif [ "$BEIJING_HOUR" = "11" ] && [ "$BEIJING_MINUTE" = "30" ]; then
            TYPE="morning_close"
          elif [ "$BEIJING_HOUR" = "13" ] && [ "$BEIJING_MINUTE" = "30" ]; then
            TYPE="noon"
          else
            TYPE="morning"
          fi
          
          echo "运行类型: ${TYPE}"
          python stock_monitor.py ${TYPE}
